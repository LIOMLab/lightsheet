# Measured V->mW calibration curve (display-only). Semicolon-separated "V,mW"
# pairs from a rig sweep with a Newport 1918-C + 818-SL power meter (OD3
# attenuator on, lambda=561nm, sensor <1cm from diode). The readback label
# interpolates this to show the actual optical output at the commanded
# voltage, switching from "(est.)" to "(cal.)". The control path (set_power
# mW->V via mW per Volt) and the two-layer clamp are NOT affected.
# Sweep: 2026-08-23, warm-up 3V/180s, 3 samples/point (first discarded),
# ascending+descending hysteresis check. Anomalies at 3.0V (asc dip) and
# 4.0V (asc spike + desc dip) replaced with desc-only / interpolation.
# Max measured output: ~78.6 mW at 3.75V (plateau ~76 mW above 4V).
# The 236.6 mW factory spec is measured differently (integrating sphere).
Laser1 Calibration Curve = 0.00,0.00;0.25,0.00;0.50,0.00;0.75,0.00;1.00,0.00;1.25,0.01;1.50,0.97;1.75,3.76;2.00,10.61;2.25,18.12;2.50,24.93;2.75,31.62;3.00,47.45;3.25,57.72;3.50,71.97;3.75,78.62;4.00,76.83;4.25,75.03;4.50,76.10;4.75,75.58;5.00,76.00
# Laser 2 is the Toptica iBeam (640 nm, COM4 serial) — see [iBeam].
# The old Laser2 * keys (which applied only to the unused DAQ AO channel
# /Dev7/ao1) are removed: the iBeam is now self.lasers[1], not a DAQ
# channel.

